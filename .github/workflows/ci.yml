name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test y build de KADRE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  exports:
    name: Verificación de los sitios exportados
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:exports
      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-exports-report
          path: .cache/verify-exports/report.json
          if-no-files-found: ignore
